# 推到 main 就自動部署到 Cloudflare Pages。
#
# 需要在 repo → Settings → Secrets and variables → Actions 設兩個 secret：
#   CLOUDFLARE_API_TOKEN   權限選 Account → Cloudflare Pages → Edit
#   CLOUDFLARE_ACCOUNT_ID  Dashboard 右側欄可以複製
#
# 用 Dashboard 的 Git 整合部署的話，這個 workflow 可以不啟用 —— 兩種擇一即可，
# 同時開會變成同一個 commit 部署兩次。
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      # 這個 repo 沒有建置步驟：public/ 直接就是成品，functions/ 由 Pages 自動辨識。
      - name: Publish
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=conssswars-web
